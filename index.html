<script>
let produto = JSON.parse(localStorage.getItem("produto_lab")) || null;
let fluxos = JSON.parse(localStorage.getItem("fluxos_lims")) || [];
let fluxoAtual = null;

function gerarLIMS(){
  return "LIMS-" + Date.now();
}

function criarFluxo() {
function criarFluxo(){
  const codigo = document.getElementById("codigo").value;
  const quantidade = document.getElementById("quantidade").value;
  const labsSelecionados = Array.from(
    document.getElementById("labs").selectedOptions
  ).map(o => o.value);
  const labs = Array.from(document.getElementById("labs").selectedOptions).map(o=>o.value);

  if (!codigo || !quantidade || labsSelecionados.length === 0) {
  if(!codigo || !quantidade || labs.length===0){
    alert("Preencha todos os campos");
    return;
  }

  produto = {
  const novo = {
    lims: gerarLIMS(),
    codigo,
    quantidade,
    fluxo: labsSelecionados,
    fluxo: labs,
    etapa: 0,
    historico: []
    historico:[]
  };

  fluxos.unshift(novo);
  salvar();
  renderizar();
  alert("Fluxo criado: " + novo.lims);
  document.getElementById("codigo").value="";
  document.getElementById("quantidade").value="";
}

function confirmar() {
  const obs = document.getElementById("obs").value;
  const data = new Date().toLocaleString("pt-BR");

  produto.historico.push({
    lab: produto.fluxo[produto.etapa],
    obs: obs || "Processo concluído sem observações",
    data
  });

  produto.etapa++;
  document.getElementById("obs").value = "";

  if (produto.etapa >= produto.fluxo.length) {
    alert("Fluxo finalizado com sucesso!");
    localStorage.removeItem("produto_lab");
    produto = null;
  }
function salvar(){
  localStorage.setItem("fluxos_lims", JSON.stringify(fluxos));
}

  salvar();
  renderizar();
function renderizarBusca(){
  const termo = document.getElementById("busca").value.toLowerCase();
  const div = document.getElementById("resultadoBusca");
  div.innerHTML="";

  fluxos
    .filter(f=>f.lims.toLowerCase().includes(termo) || f.codigo.toLowerCase().includes(termo))
    .forEach(f=>{
      div.innerHTML+=`
        <div style="padding:8px; border-bottom:1px solid #ddd; cursor:pointer;"
         onclick="abrirFluxo('${f.lims}')">
         ${f.lims} | ${f.codigo}
        </div>
      `;
    });
}

function salvar() {
  if (produto) {
    localStorage.setItem("produto_lab", JSON.stringify(produto));
  }
function abrirFluxo(lims){
  fluxoAtual = fluxos.find(f=>f.lims===lims);
  document.getElementById("operador").classList.remove("hidden");
  document.getElementById("historico").classList.add("hidden");
  renderizarOperador();
}

function renderizarFluxograma() {
  const fluxoDiv = document.getElementById("fluxograma");
  fluxoDiv.innerHTML = "";
function renderizarOperador(){
  document.getElementById("opLims").innerText=fluxoAtual.lims;
  document.getElementById("opCodigo").innerText=fluxoAtual.codigo;
  document.getElementById("opQtd").innerText=fluxoAtual.quantidade;

  produto.fluxo.forEach((lab, index) => {
    const step = document.createElement("div");
    step.className = "flow-step";
  const div=document.getElementById("fluxograma");
  div.innerHTML="";

    if (index < produto.etapa) step.classList.add("done");
    if (index === produto.etapa) step.classList.add("active");
  fluxoAtual.fluxo.forEach((lab,index)=>{
    let classe="flow-step";
    if(index<fluxoAtual.etapa) classe+=" done";
    if(index===fluxoAtual.etapa) classe+=" active";

    step.innerHTML = `
      <div class="flow-dot"></div>
      <span>${lab}</span>
    div.innerHTML+=`
      <div class="${classe}">
        <div class="dot"></div>
        ${lab}
      </div>
    `;

    fluxoDiv.appendChild(step);
  });
}

function renderizar() {
  if (!produto) {
    document.getElementById("criacao").classList.remove("hidden");
    document.getElementById("operador").classList.add("hidden");
    return;
  }
function confirmar(){
  const obs=document.getElementById("obs").value;
  const data=new Date().toLocaleString("pt-BR");

  document.getElementById("criacao").classList.add("hidden");
  document.getElementById("operador").classList.remove("hidden");
  fluxoAtual.historico.push({
    etapa: fluxoAtual.fluxo[fluxoAtual.etapa],
    data,
    obs: obs || "Sem observações"
  });

  document.getElementById("opCodigo").innerText = produto.codigo;
  document.getElementById("opQtd").innerText = produto.quantidade;
  fluxoAtual.etapa++;
  document.getElementById("obs").value="";

  renderizarFluxograma();
  salvar();
  renderizarOperador();
}

renderizar();
function verHistorico(){
  document.getElementById("operador").classList.add("hidden");
  document.getElementById("historico").classList.remove("hidden");

  const div=document.getElementById("listaHistorico");
  div.innerHTML="";

  fluxoAtual.historico.forEach(h=>{
    div.innerHTML+=`
      <div class="history-item">
        <strong>${h.etapa}</strong><br>
        ${h.data}<br>
        ${h.obs}
      </div>
    `;
  });
}

function voltarOperador(){
  document.getElementById("historico").classList.add("hidden");
  document.getElementById("operador").classList.remove("hidden");
}
</script>
